    <script>
        function sayHello(theName, theGender) {
  if(theGender === "Male"){
    console.log(`Hello Mr ${theName}`);
  }
  else if(theGender === "Female"){
    console.log(`Hello Miss ${theName}`);
  }
  else{
    console.log(`Hello ${theName}`);
  }
}

// Needed Output
sayHello("Osama", "Male"); // "Hello Mr Osama"
sayHello("Eman", "Female"); // "Hello Miss Eman"
sayHello("Sameh"); // "Hello Sameh"



    function calculate(firstNum, secondNum, operation) {
  if(secondNum == undefined){
    console.log("Second Number Not Found");
       return;
}

 if(operation == "subtract"){
            console.log(firstNum - secondNum);
        }
        else if (operation == "multiply"){
            console.log(firstNum * secondNum);
        }
        else{
            console.log(firstNum + secondNum);
        }
}

// Needed Output
calculate(20); // Second Number Not Found
calculate(20, 30); // 50
calculate(20, 30, 'add'); // 50
calculate(20, 30, 'subtract'); // -10
calculate(20, 30, 'multiply'); // 600



function ageInTime(theAge) {
  // Your Code Here
  if(theAge > 100 || theAge < 10){
    console.log("Age Out Of Range");
    return;
  }

  console.log(`${theAge* 12}  Months
  ${theAge* 12 * 4}  weeks
  ${theAge * 12 * 4 * 7} days
  ${theAge* 12 * 4 * 7 * 24}  hours
  ${theAge* 12 * 4 * 7 * 24 * 60}  min
  ${theAge* 12 * 4 * 7 * 24 * 60 * 60}  sec`);
}

// Needed Output
ageInTime(110); // Age Out Of Range
ageInTime(38); // Months Example => 456 Months




    function checkStatus(a, b, c) {
  // Your Code Here
  let name = typeof a ==="string"? a:typeof b === "string"? b:c;
  let age = typeof a ==="number"?a : typeof b ==="number" ? b:c;
  let status = typeof a ==="boolean"?a : typeof b ==="boolean" ? b:c;
  if(status){
    console.log(`"Hello ${name}, Your Age Is ${age}, You Are Available For Hire"`);
  }
  else{
    console.log(`"Hello ${name}, Your Age Is ${age}, You Are Not Available For Hire"`);
  }
}

// Needed Output
checkStatus("Osama", 38, true); // "Hello Osama, Your Age Is 38, You Are Available For Hire"
checkStatus(38, "Osama", true); // "Hello Osama, Your Age Is 38, You Are Available For Hire"
checkStatus(true, 38, "Osama"); // "Hello Osama, Your Age Is 38, You Are Available For Hire"
checkStatus(false, "Osama", 38); // "Hello Osama, Your Age Is 38, You Are Not Available For Hire"
  
  
  
  
  function createSelectBox(startYear, endYear) {
  // Your Code Here
  document.write(`<select>`);
  
  for (let i = startYear; i <= endYear; i++) {
    document.write(`<option value="${i}">${i}</option>`);
  }
  
  document.write(`</select>`);
}
createSelectBox(2000, 2021);


function multiply(...num){

    let res = 1;

    for(let i =0; i < num.length; i++){

        if(typeof num[i] === "string")continue;

        res *= Math.floor(num[i]); 
    }
    console.log(res);
}



multiply(10, 20); // 200
multiply("A", 10, 30); // 300
multiply(100.5, 10, "B"); // 1000
